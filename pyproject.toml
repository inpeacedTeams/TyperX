[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "typerx"
version = "1.1.2"
description = "Local-first natural typing studio for Windows"
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = { text = "MIT" }
authors = [{ name = "inpeacedTeams" }]
dependencies = [
    "PySide6>=6.8,<7",
    "interception-python>=1.13.6,<2",
    "pywin32>=308",
    "pywinauto>=0.6.9,<0.7",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "pytest-cov>=6", "ruff>=0.9", "mypy>=1.14", "pyinstaller>=6.11"]

[project.scripts]
typerx = "typerx.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/typerx"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q --disable-warnings --maxfail=1"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["E501", "E701", "E702", "I001", "RUF001", "RUF012", "SIM105", "UP037"]

[tool.ruff.lint.per-file-ignores]
"src/typerx/ui/main_window.py" = ["F401"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["typerx"]
