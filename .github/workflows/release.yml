name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest
      - run: pyinstaller --clean --noconfirm typerx.spec
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/TyperX.exe
          generate_release_notes: true
