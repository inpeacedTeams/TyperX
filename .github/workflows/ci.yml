name: quality
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - run: ruff check src tests
      - name: Unit and regression tests
        run: python -m pytest --ignore=tests/test_webview_smoke.py --cov=typerx.domain --cov=typerx.persistence --cov-report=term-missing
      - name: Real WebEngine and QWebChannel smoke tests
        timeout-minutes: 5
        env:
          QT_QPA_PLATFORM: offscreen
          QTWEBENGINE_CHROMIUM_FLAGS: --disable-gpu
        run: python -m unittest discover -s tests -p test_webview_smoke.py -v
      - run: python -m compileall -q src
      - run: pyinstaller --clean --noconfirm typerx.spec
      # CI validates the build; artifact storage is optional because quota is external.
      - uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: TyperX-windows-x64
          path: dist/TyperX.exe
          if-no-files-found: error
          retention-days: 1
