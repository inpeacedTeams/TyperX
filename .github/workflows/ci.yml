name: quality
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - run: ruff check src tests
      - run: python -m pytest --cov=typerx.domain --cov=typerx.persistence --cov-report=term-missing
      - run: python -m compileall -q src
      - run: pyinstaller --clean --noconfirm typerx.spec
      - uses: actions/upload-artifact@v4
        with:
          name: TyperX-windows-x64
          path: dist/TyperX.exe
          if-no-files-found: error
